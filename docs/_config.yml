title: shunt
description: Registry-free Docker deploys over ssh. One app, one server, no orchestrator.

url: https://oaisp.github.io
baseurl: /shunt

theme: just-the-docs
permalink: pretty

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/

# Every page gets the theme layout without repeating front matter in each file.
# Without this, pages render bare: no navigation, no search, no footer.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Navigation
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

search_enabled: true
search:
  heading_level: 2
  previews: 2
  rel_url: false

aux_links:
  Source:
    - https://github.com/OAISP/shunt
aux_links_new_tab: true

# Every page carries a link to its own source, so a wrong sentence is one click
# from the file that needs correcting.
gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: https://github.com/OAISP/shunt
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

color_scheme: light

callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

footer_content: >-
  shunt is MIT licensed. Documentation for the version on
  <a href="https://github.com/OAISP/shunt">main</a>.
